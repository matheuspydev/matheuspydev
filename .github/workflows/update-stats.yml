name: Update stats card

on:
  schedule:
    # 03:20 UTC daily. Off the hour on purpose — GitHub drops scheduled runs
    # when too many repos ask for the same popular minute.
    - cron: '20 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/gen-stats.mjs'
      - '.github/workflows/update-stats.yml'

# Only the commit below needs write access.
permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate assets/stats.svg
        env:
          # Raises the API rate limit from 60/h to 1000/h. Only public data
          # is read, so the default read-only token is enough.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-stats.mjs

      - name: Commit if the card actually changed
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "No change in the language mix — nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg
          git commit -m 'chore: refresh language mix card [skip ci]'
          git push
